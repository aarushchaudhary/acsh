name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Ubuntu (glibc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build and comparison tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential busybox autoconf

      - name: Build
        run: make

      - name: Test suite (run by acsh itself)
        run: |
          sed -i 's/\r$//' test_acsh.sh
          ./acsh test_acsh.sh

      - name: Differential tests against busybox ash
        run: tests/run_diff.sh ./acsh

      - name: Interactive tests on a pty
        run: make tests/pty/pty_test && tests/pty/pty_test ./acsh

      - name: Real-world scripts (init scripts, ./configure) against busybox ash
        run: tests/realworld/run.sh ./acsh

      - name: Bash extras (here-strings, brace expansion, printf %q) against bash
        run: tests/bash_extras/run.sh ./acsh

  sanitizers:
    name: AddressSanitizer + UndefinedBehaviorSanitizer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build and comparison tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential busybox

      - name: Build with sanitizers (as ./acsh, which test_acsh.sh runs)
        run: make CFLAGS="-O1 -g -std=c11 -Iinclude -fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=undefined"

      - name: Both suites under the sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          sed -i 's/\r$//' test_acsh.sh
          ./acsh test_acsh.sh
          tests/run_diff.sh ./acsh
          make tests/pty/pty_test
          tests/pty/pty_test ./acsh

  minimal:
    name: MINIMAL=1 build (no line editor, completion or suggestions)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build and comparison tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential busybox

      - name: Build both and compare sizes
        run: |
          make && strip -o full.stripped acsh
          make MINIMAL=1 && strip -o minimal.stripped acsh
          ls -l full.stripped minimal.stripped

      - name: All suites on the minimal build
        run: |
          sed -i 's/\r$//' test_acsh.sh
          ./acsh test_acsh.sh
          tests/run_diff.sh ./acsh
          make tests/pty/pty_test && tests/pty/pty_test --minimal ./acsh

  fuzz:
    name: libFuzzer (parser and expansion, 2 minutes each)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the fuzz targets
        run: make fuzz

      - name: Seed corpora from the test scripts
        run: |
          mkdir -p corpus/parse corpus/expand
          cp tests/diff/*.sh test_acsh.sh corpus/parse/
          i=0
          grep -h '\$' tests/diff/*.sh | grep -v '^#' | while IFS= read -r line; do
            i=$((i+1)); printf '%s' "$line" > corpus/expand/seed$i
          done

      - name: Fuzz the parser
        run: ./fuzz_parse -max_total_time=120 -max_len=4096 -timeout=10 -close_fd_mask=3 corpus/parse

      - name: Fuzz expansion and arithmetic
        run: ./fuzz_expand -max_total_time=120 -max_len=2048 -timeout=10 -close_fd_mask=3 corpus/expand

      - name: Keep any crashing input
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: |
            crash-*
            leak-*
            timeout-*
            oom-*

  bench:
    name: Benchmarks against a standalone static ash (Alpine, musl)
    runs-on: ubuntu-latest
    container: alpine:3.20
    env:
      BUSYBOX: busybox-1.36.1
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: apk add --no-cache build-base linux-headers perl busybox

      - name: Build acsh, full and minimal, as released (static, musl, -Os)
        run: |
          make static && mv acsh-static acsh-full-static
          make static MINIMAL=1 && mv acsh-static acsh-min-static

      - name: Build a standalone static ash from busybox (ash only, Alpine-like features)
        run: |
          wget -q https://busybox.net/downloads/$BUSYBOX.tar.bz2 https://busybox.net/downloads/$BUSYBOX.tar.bz2.sha256
          sha256sum -c $BUSYBOX.tar.bz2.sha256
          tar xjf $BUSYBOX.tar.bz2
          cd $BUSYBOX
          make allnoconfig >/dev/null
          for opt in STATIC ASH SH_IS_ASH ASH_OPTIMIZE_FOR_SIZE ASH_INTERNAL_GLOB ASH_BASH_COMPAT \
                     ASH_JOB_CONTROL ASH_ALIAS ASH_RANDOM_SUPPORT ASH_EXPAND_PRMT ASH_ECHO ASH_PRINTF \
                     ASH_TEST ASH_HELP ASH_GETOPTS ASH_CMDCMD FEATURE_SH_MATH FEATURE_SH_MATH_64 \
                     FEATURE_EDITING FEATURE_EDITING_SAVEHISTORY FEATURE_TAB_COMPLETION \
                     FEATURE_EDITING_FANCY_PROMPT FEATURE_SH_HISTFILESIZE; do
            sed -i "s/^# CONFIG_$opt is not set/CONFIG_$opt=y/" .config
          done
          yes '' | make oldconfig >/dev/null
          make -j"$(nproc)" >/dev/null
          strip busybox
          cp busybox ../ash-static
          cd ..
          ./ash-static ash -c 'echo standalone ash works: $((6*7))'

      - name: Size, idle memory and 1,000 runs of -c true (gate checked)
        run: |
          ln -s "$PWD/ash-static" ./ash
          CHECK=1 tests/bench/bench.sh "ash=./ash" "acsh-min=./acsh-min-static" "acsh=./acsh-full-static"

  alpine:
    name: Alpine (musl, real busybox ash)
    runs-on: ubuntu-latest
    container: alpine:3.20
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: apk add --no-cache build-base busybox openrc abuild autoconf

      - name: Build (dynamic and static)
        run: |
          make
          make static
          ls -l acsh acsh-static

      - name: Test suite (run by acsh itself)
        run: |
          sed -i 's/\r$//' test_acsh.sh
          ./acsh test_acsh.sh

      - name: Differential tests against Alpine's busybox ash
        run: tests/run_diff.sh ./acsh

      - name: Interactive tests on a pty (as root, with /etc/acshrc and su)
        run: make tests/pty/pty_test && tests/pty/pty_test ./acsh

      - name: Real-world scripts (/etc/profile, OpenRC init scripts, abuild, ./configure) against Alpine's ash
        run: tests/realworld/run.sh ./acsh

      - name: Community re-check on the release build (static, musl)
        run: tests/complaints.sh ./acsh-static

      - name: Alpine's /etc/profile runs cleanly in a login shell
        run: |
          ./acsh -l -c 'echo "login PATH=$PATH"' 2>profile.err
          cat profile.err
          test ! -s profile.err

      - name: Keep the static binary
        uses: actions/upload-artifact@v4
        with:
          name: acsh-static
          path: acsh-static

  scratch:
    name: Static binary in an empty container
    needs: alpine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: acsh-static

      - name: Run acsh-static in FROM scratch (no libc, no files)
        run: |
          chmod +x acsh-static
          printf 'FROM scratch\nCOPY acsh-static /acsh\nENTRYPOINT ["/acsh"]\n' > Dockerfile
          docker build -t acsh-scratch .
          out=$(docker run --rm acsh-scratch -c 'x=$((6*7)); f() { echo "f:$1"; }; f "$x"; case $x in 4?) echo match;; esac')
          echo "$out"
          test "$out" = "$(printf 'f:42\nmatch')"

name: Release

# Push a tag vX.Y.Z to publish a release. The tag must match the version
# in src/prompt.c (ACSH_VERSION). Every binary is built and tested on
# Alpine, statically linked with musl, so it runs on any Linux of its
# architecture: Alpine, glibc distributions, BusyBox systems, FROM scratch.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: Build and test (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      # The build and the tests run in Alpine (musl, busybox ash, as root,
      # as in CI). The actions above and below run on the runner itself.
      - name: Build and test in Alpine 3.20
        run: |
          docker run --rm -v "$PWD:/src" -w /src -e GITHUB_REF_NAME alpine:3.20 sh -ec '
            apk add --no-cache build-base linux-headers busybox bash openrc abuild autoconf automake

            echo "== the tag matches the version in the source"
            want=${GITHUB_REF_NAME#v}
            have=$(sed -n "s/^#define ACSH_VERSION \"\(.*\)\"/\1/p" src/prompt.c)
            echo "tag $GITHUB_REF_NAME, source $have"
            test "$want" = "$have"

            echo "== every test suite, full build";    make check
            echo "== every test suite, minimal build"; make clean && make MINIMAL=1 check
            echo "== community re-check, release build"; make clean && make recheck

            echo "== release binaries (static, musl)"
            mkdir -p dist
            make clean && make static           && mv acsh-static dist/acsh-${{ matrix.arch }}
            make clean && make static MINIMAL=1 && mv acsh-static dist/acsh-${{ matrix.arch }}-minimal
            make clean
            ls -l dist
          '

      - name: The binaries run outside Alpine too (Ubuntu, no musl installed)
        run: |
          for b in dist/acsh-*; do
            "$b" -c 'echo "$0 runs: $((6*7))"' "$b"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: acsh-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error

  release:
    name: Publish the release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Add the rc file and checksums
        run: |
          cp config/acshrc.default dist/.acshrc
          cd dist
          chmod +x acsh-*
          sha256sum acsh-* .acshrc > SHA256SUMS
          cat SHA256SUMS

      - name: Release notes for this version, if written
        id: notes
        run: |
          f=docs/releases/${GITHUB_REF_NAME}.md
          if [ -f "$f" ]; then echo "path=$f" >> "$GITHUB_OUTPUT"; fi

      - uses: softprops/action-gh-release@v2
        with:
          name: acsh ${{ github.ref_name }}
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: true
          files: |
            dist/acsh-x86_64
            dist/acsh-x86_64-minimal
            dist/acsh-aarch64
            dist/acsh-aarch64-minimal
            dist/.acshrc
            dist/SHA256SUMS
